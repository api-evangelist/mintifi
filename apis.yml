name: Mintifi
description: 'Mintifi is an Indian supply-chain financing platform that provides inventory
  and working-capital financing to SMEs, distributors, and dealers across manufacturer
  distribution networks. Its products include checkout and inventory financing, an
  Electronic Invoice Presentment and Payment (EIPP) solution for ERP-integrated invoice
  settlement and reconciliation, WhatsApp-based inventory financing, and Mintifi Collect
  for payment collection with Tally integration. The company exposes ERP-integration
  APIs to partners and is backed by Norwest Venture Partners. No public developer portal,
  OpenAPI, or self-serve API documentation is currently published; the docs host is
  access-gated.'
